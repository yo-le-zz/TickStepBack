name: TickStepBack
version: '${version}'
main: dev.yolezz.tickstepback.TickStepBackPlugin
# EXPERIMENTAL / NON TESTE - voir root README "Compatibilite" et
# paper-26/build.gradle.kts. '26.2' est la valeur attendue pour la ligne
# de versionnage par annee (successeur de 1.21.x), a verifier contre les
# valeurs reellement acceptees par votre build Paper 26.x au moment ou
# vous testez.
api-version: '26.2'
# Folia (Paper's region-threaded fork) is NOT supported and this is left
# false deliberately, not as an oversight: Folia has no single global
# server tick / main thread the way this plugin assumes throughout
# (TickTracker, the ring buffer, RollbackManager) - each region ticks on
# its own thread. Making this plugin Folia-safe is a real architecture
# change, not a config flag. See README "Compatibilite".
folia-supported: false
author: yo_le_zz
description: >
  [EXPERIMENTAL / NON TESTE, ligne 26.x] Debug temporel pour Minecraft
  Paper/Purpur : permet de revenir en arriere sur les ticks executes
  depuis le dernier /tick step, pour le debug de machines Redstone.
website: https://github.com/yolezz/TickStepBack

commands:
  tickstepback:
    description: Revenir en arriere sur les derniers ticks executes par /tick step.
    usage: |
      /<command> <ticks>          - revenir en arriere de <ticks> ticks
      /<command> status           - afficher l'etat de l'historique
      /<command> checkpoint       - forcer un checkpoint manuel
      /<command> clear            - vider l'historique
    aliases: [stepback]
    permission: tickstepback.use
  tsb:
    description: Alias court de /tickstepback.
    usage: |
      /<command> <ticks>          - revenir en arriere de <ticks> ticks
      /<command> status           - afficher l'etat de l'historique
      /<command> checkpoint       - forcer un checkpoint manuel
      /<command> clear            - vider l'historique
    permission: tickstepback.use

permissions:
  tickstepback.use:
    description: Autorise l'utilisation de /tickstepback (stepback, status).
    default: op
  tickstepback.admin:
    description: Autorise les operations sensibles (clear, reload, checkpoint manuel).
    default: op
